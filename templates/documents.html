<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="{{ url_for('static', filename='js/documents.js') }}" defer></script>
  <style>
    body { margin: 0; background: #F7F7FB; }
    a { color: #6D5BD0; text-decoration: none; }
    a:hover { color: #5A48BD; }
  </style>
</head>
<body data-patient-id="{{ patient_id }}" data-first-name="{{ first_name }}">
<div style="font-family:'Inter',sans-serif;min-height:100vh;background:#F7F7FB">
  <div style="position:fixed;top:0;left:0;width:240px;height:100vh;background:#FFFFFF;border-right:1px solid #E7E5F1;display:flex;flex-direction:column;padding:24px 16px;box-sizing:border-box;z-index:10">
    <div style="display:flex;align-items:center;gap:8px;padding:0 8px 24px 8px">
      <div style="width:32px;height:32px;border-radius:8px;background:#6D5BD0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px">CF</div>
      <div style="display:flex;flex-direction:column;line-height:1.1">
        <span style="font-weight:800;font-size:16px;color:#1E1B2E">CareFlow</span>
        <span style="font-weight:600;font-size:10px;letter-spacing:1px;color:#6D5BD0;text-transform:uppercase">AI</span>
      </div>
    </div>
    <nav style="display:flex;flex-direction:column;gap:2px;flex:1">
      <a href="/patient/dashboard" style="display:flex;align-items:center;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:#6B6880">Dashboard</a>
      <a href="/intake/chat" style="display:flex;align-items:center;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:#6B6880">AI Intake</a>
      <a href="/patient/intake-history" style="display:flex;align-items:center;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:#6B6880">Intake History</a>
      <a href="/patient/clinical-summary" style="display:flex;align-items:center;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:#6B6880">Clinical Summary</a>
      <a href="/patient/my-documents" style="display:flex;align-items:center;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;background:#EFECFB;color:#6D5BD0">Documents</a>
      <a href="/patient/appointments" style="display:flex;align-items:center;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:#6B6880">Appointments</a>
      <a href="/patient/my-doctors" style="display:flex;align-items:center;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:#6B6880">My Doctors</a>
    </nav>
    <div style="display:flex;flex-direction:column;gap:2px;border-top:1px solid #E7E5F1;padding-top:12px">
      <a href="/patient/profile-settings" style="display:flex;align-items:center;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:#6B6880">Profile & Settings</a>
      <a href="/patient/settings" style="display:flex;align-items:center;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:#6B6880">Settings</a>
      <a href="/login" id="logoutLink" style="display:flex;align-items:center;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:#E0524A">Log out</a>
    </div>
  </div>

  <div style="margin-left:240px;padding:40px;box-sizing:border-box;max-width:720px">
    <div style="font-size:26px;font-weight:800;color:#1E1B2E;margin-bottom:4px">Documents</div>
    <div style="font-size:14px;color:#6B6880;margin-bottom:24px">Upload lab results or referral notes for AI-assisted review.</div>

    <div id="uploadArea" style="border:2px dashed #E7E5F1;border-radius:12px;padding:32px;text-align:center;margin-bottom:24px;cursor:pointer;background:#FFFFFF">
      <div style="font-size:14px;font-weight:700;color:#1E1B2E;margin-bottom:4px">Drop a file here, or click to upload</div>
      <div style="font-size:13px;color:#6B6880">PDF, TXT · up to 20MB</div>
      <input id="fileInput" type="file" style="display:none" />
    </div>

    <div id="uploadStatus" style="display:none;background:#EFECFB;color:#5A48BD;font-size:13px;font-weight:600;padding:12px 16px;border-radius:8px;margin-bottom:20px">Analyzing document…</div>

    <div style="display:flex;flex-direction:column;gap:12px" id="documentsList"></div>

    <div style="margin-top:32px;padding-top:16px;border-top:1px solid #E7E5F1;font-size:12px;color:#6B6880"></div>
  </div>
</div>
</body>
</html>
