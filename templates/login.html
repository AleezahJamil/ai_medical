<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="{{ url_for('static', filename='js/login.js') }}" defer></script>
  <style>
    body { margin: 0; background: #F7F7FB; }
    a { color: #6D5BD0; }
    a:hover { color: #5A48BD; }
  </style>
</head>
<body>
<div style="font-family:'Inter',sans-serif;min-height:100vh;background:#F7F7FB;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box">
  <div style="width:100%;max-width:420px;background:#FFFFFF;border:1px solid #E7E5F1;border-radius:18px;padding:32px;box-shadow:0 4px 12px rgba(30,27,46,0.08),0 16px 40px rgba(30,27,46,0.10);box-sizing:border-box">
    <div style="display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:24px">
      <div style="width:32px;height:32px;border-radius:8px;background:#6D5BD0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px">CF</div>
      <span style="font-weight:800;font-size:18px;color:#1E1B2E">CareFlow AI</span>
    </div>

    <div style="display:flex;background:#F7F7FB;border-radius:8px;padding:4px;margin-bottom:20px">
      <button id="loginTab" type="button" style="flex:1;border:none;background:#FFFFFF;color:#1E1B2E;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;padding:8px 0;border-radius:6px;cursor:pointer">Log in</button>
      <button id="registerTab" type="button" style="flex:1;border:none;background:transparent;color:#6B6880;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;padding:8px 0;border-radius:6px;cursor:pointer">Create account</button>
    </div>

    <div style="font-size:12px;font-weight:600;color:#6B6880;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">I am a</div>
    <div style="display:flex;gap:8px;margin-bottom:20px">
      <button id="patientTab" type="button" style="flex:1;padding:10px 0;border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;cursor:pointer;border:1px solid #6D5BD0;background:#EFECFB;color:#5A48BD">Patient</button>
      <button id="doctorTab" type="button" style="flex:1;padding:10px 0;border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;cursor:pointer;border:1px solid #E7E5F1;background:#FFFFFF;color:#6B6880">Doctor</button>
    </div>

    <div id="messageContainer" style="min-height:24px;margin-bottom:12px;color:#E0524A;font-size:13px"></div>

    <div id="resendField" style="display:none;margin-bottom:14px;padding:14px;border:1px solid #E7E5F1;border-radius:8px;background:#F7F7FB">
      <label style="font-size:13px;font-weight:600;color:#1E1B2E;display:block;margin-bottom:6px">Resend verification email</label>
      <input id="resendEmailInput" type="email" placeholder="you@example.com" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #E7E5F1;border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;color:#1E1B2E;background:#FFFFFF;margin-bottom:8px" />
      <button id="resendButton" type="button" style="width:100%;background:#6D5BD0;color:#fff;border:none;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;padding:10px 0;border-radius:8px;cursor:pointer">Resend verification email</button>
    </div>

    <form id="authForm" style="display:flex;flex-direction:column;gap:14px">
      <div id="nameField" style="display:none">
        <label style="font-size:13px;font-weight:600;color:#1E1B2E;display:block;margin-bottom:6px">Full name</label>
        <input id="nameInput" type="text" placeholder="Maya Chen" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #E7E5F1;border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;color:#1E1B2E;background:#FFFFFF;" />
      </div>
      <div>
        <label style="font-size:13px;font-weight:600;color:#1E1B2E;display:block;margin-bottom:6px">Email</label>
        <input id="emailInput" type="email" placeholder="maya.chen@example.com" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #E7E5F1;border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;color:#1E1B2E;background:#FFFFFF;" />
      </div>
      <div>
        <label style="font-size:13px;font-weight:600;color:#1E1B2E;display:block;margin-bottom:6px">Password</label>
        <input id="passwordInput" type="password" placeholder="••••••••" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #E7E5F1;border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;color:#1E1B2E;background:#FFFFFF;" />
      </div>
      <button id="submitButton" type="submit" style="margin-top:6px;background:#6D5BD0;color:#fff;border:none;font-family:'Inter',sans-serif;font-size:15px;font-weight:700;padding:12px 0;border-radius:8px;cursor:pointer">Log in</button>
    </form>

    <div style="text-align:center;font-size:13px;color:#6B6880;margin-top:16px">
      <span id="switchPrompt">Don't have an account?</span>
      <a href="#" id="switchLink" style="font-weight:700;text-decoration:none">Create one</a>
    </div>

    <div style="margin-top:24px;padding-top:16px;border-top:1px solid #E7E5F1;font-size:12px;color:#6B6880;text-align:center"></div>
  </div>
</div>
</body>
</html>
