<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>(function(){try{if(localStorage.getItem('careflow-theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="{{ url_for('static', filename='js/patient_profile_settings.js') }}" defer></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
  <script src="{{ url_for('static', filename='js/responsive_nav.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
  <style>
    body { margin: 0; }
    a { text-decoration: none; }
  </style>
</head>
<body data-patient-id="{{ patient_id }}" data-first-name="{{ first_name }}">
<div style="font-family:'Inter',sans-serif;min-height:100vh;background:var(--page-bg)">
  <button type="button" class="cf-hamburger" aria-label="Open menu"><span></span></button>
  <div class="cf-sidebar-backdrop"></div>
  <div class="cf-sidebar" style="position:fixed;top:0;left:0;width:240px;height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 16px;box-sizing:border-box;z-index:10">
    <div style="display:flex;align-items:center;gap:8px;padding:0 8px 24px 8px">
      <div style="width:32px;height:32px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px">CF</div>
      <div style="display:flex;flex-direction:column;line-height:1.1">
        <span style="font-weight:800;font-size:16px;color:var(--text-primary)">CareFlow</span>
        <span style="font-weight:600;font-size:10px;letter-spacing:1px;color:var(--accent);text-transform:uppercase">AI</span>
      </div>
    </div>
    <nav style="display:flex;flex-direction:column;gap:2px;flex:1">
      <a href="/patient/dashboard" style="display:flex;align-items:center;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--text-secondary)">Dashboard</a>
      <a href="/intake/chat" style="display:flex;align-items:center;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--text-secondary)">AI Intake</a>
      <a href="/patient/intake-history" style="display:flex;align-items:center;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--text-secondary)">Intake History</a>
      <a href="/patient/clinical-summary" style="display:flex;align-items:center;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--text-secondary)">Clinical Summary</a>
      <a href="/patient/my-documents" style="display:flex;align-items:center;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--text-secondary)">Documents</a>
      <a href="/patient/appointments" style="display:flex;align-items:center;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--text-secondary)">Appointments</a>
      <a href="/patient/my-doctors" style="display:flex;align-items:center;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--text-secondary)">My Doctors</a>
    </nav>
    <div style="display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--border);padding-top:12px">
      <a href="/patient/profile-settings" style="display:flex;align-items:center;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;background:var(--accent-soft);color:var(--accent)">Profile & Settings</a>
      <a href="/patient/settings" style="display:flex;align-items:center;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--text-secondary)">Settings</a>
      <a href="/login" id="logoutLink" style="display:flex;align-items:center;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--danger)">Log out</a>
    </div>
  </div>

  <div class="cf-content" style="margin-left:240px;padding:40px;box-sizing:border-box;max-width:600px">
    <div style="font-size:26px;font-weight:800;color:var(--text-primary);margin-bottom:24px">Profile</div>

    <form id="profileForm" style="background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:var(--shadow)">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border)">
        <div style="width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center">{{ name[0] if name else '' }}</div>
        <div>
          <div style="font-size:18px;font-weight:800;color:var(--text-primary)">{{ name }}</div>
          <div style="font-size:13px;color:var(--text-secondary)">Patient ID {{ patient_id }}</div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:16px">
        <div>
          <label style="font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:6px">Full name</label>
          <input id="nameInput" value="{{ name }}" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;color:var(--text-primary);background:var(--surface);color-scheme:light" />
        </div>
        <div class="cf-grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div>
            <label style="font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:6px">Date of birth</label>
            <input id="dobInput" value="{{ dob }}" readonly style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;color:var(--text-primary);background:var(--page-bg);color-scheme:light" />
          </div>
          <div>
            <label style="font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:6px">Age</label>
            <input id="ageInput" value="{{ age }}" readonly style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;color:var(--text-primary);background:var(--page-bg);color-scheme:light" />
          </div>
        </div>
        <div>
          <label style="font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:6px">Email</label>
          <input id="emailInput" value="{{ email }}" type="email" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;color:var(--text-primary);background:var(--surface);color-scheme:light" />
        </div>
        <div>
          <label style="font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:6px">Phone</label>
          <input id="phoneInput" value="{{ phone }}" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;color:var(--text-primary);background:var(--surface);color-scheme:light" />
        </div>
      </div>

      <div id="statusMessage" style="display:none;margin-top:24px;padding:14px 16px;border-radius:12px;font-size:14px"></div>
      <button id="saveButton" type="submit" style="margin-top:24px;background:var(--accent);color:#fff;border:none;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;padding:12px 24px;border-radius:8px;cursor:pointer">Save changes</button>
    </form>

    <div style="margin-top:32px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--text-secondary)"></div>
  </div>
</div>
</body>
</html>
